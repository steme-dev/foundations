name: CI

# Every pull request and every push to main runs the whole check: the types, the lint, the format and
# the data's tests.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.1"
          install_args: node
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

  # On main only, one at a time in push order, after the check: the schema's migrations, then the
  # worker and the site. Only these two steps hold the Cloudflare credential.
  deploy:
    name: Deploy foundations.steme.dev
    needs: [check]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node (mise.toml)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: "2026.11.1"
          install_args: node
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build the site
        run: pnpm build

      - name: Check this commit is still main's head
        id: newest
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::notice::origin/main has moved past $(git rev-parse --short HEAD); not deploying this commit"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the database's migrations
        if: steps.newest.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply foundations --remote

      # `wrangler deploy`, not `versions upload`: only it applies the custom domain.
      - name: Deploy
        if: steps.newest.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Check the deployed site
        if: steps.newest.outputs.skip != 'true'
        run: node scripts/check-deployed.mjs https://foundations.steme.dev
